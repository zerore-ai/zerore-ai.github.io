# 与上海源站当前 Certbot 证书路径配套；更新前先执行 nginx -t。
server {
    server_name zerore.cn www.zerore.cn;
    root /home/ubuntu/1.zerore-ai/public;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;

    error_page 404 /404.html;
    location = /404.html { internal; }

    location = /site.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location = /api/ping {
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header X-Zerore-Origin "shanghai" always;
        return 200 '{"ok":true,"service":"zerore-cn-origin"}';
    }

    location = /speedtest { return 308 /speedtest/; }

    location = /speedtest/index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files $uri =404;
    }

    location ~ ^/speedtest/(100k|1m|5m)\.bin$ {
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / { try_files $uri $uri/ =404; }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/zerore.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zerore.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name zerore.cn www.zerore.cn;
    return 301 https://$host$request_uri;
}
